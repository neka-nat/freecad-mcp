[project]
name = "freecad-mcp"
dynamic = ["version"]
description = "MCP server for FreeCAD: create and edit models, run Python scripts, inspect documents and run FEM analyses from Claude and other MCP clients"
keywords = ["freecad", "mcp", "model-context-protocol", "cad", "3d-modeling", "fem", "claude"]
readme = "README.md"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # Security floors also apply to installations from published wheels.
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "mcp[cli]>=1.28.1,<3",
    "pyjwt>=2.15.0",
    "validators>=0.34.0",
]

[project.urls]
Repository = "https://github.com/neka-nat/freecad-mcp"
Documentation = "https://github.com/neka-nat/freecad-mcp/tree/main/docs"
Issues = "https://github.com/neka-nat/freecad-mcp/issues"

[project.scripts]
freecad-mcp = "freecad_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "addon/FreeCADMCP/package.xml"
pattern = '<version>(?P<version>[^<]+)</version>'

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "addon/FreeCADMCP/package.xml" }]

[tool.hatch.build.targets.sdist]
exclude = ["assets", "results"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

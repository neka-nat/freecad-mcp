[project]
name = "freecad-mcp"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.28.1,<3",
    "validators>=0.34.0",
]

[project.scripts]
freecad-mcp = "freecad_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "addon/FreeCADMCP/package.xml"
pattern = '<version>(?P<version>[^<]+)</version>'

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "addon/FreeCADMCP/package.xml" }]

[tool.hatch.build.targets.sdist]
exclude = ["assets", "results"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
